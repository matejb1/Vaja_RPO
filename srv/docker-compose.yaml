services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU11-ubuntu-24.04
    container_name: sqlserver
    hostname: sqlserver
    restart: always
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: mssql
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}

      KC_SPI_THEME_STATIC_MAX_AGE: "-1" # za development
      KC_SPI_THEME_CACHE_THEMES: "false" # za development
      KC_SPI_THEME_CACHE_TEMPLATES: "false" # za development
    command:
      - start-dev
    depends_on:
      - sqlserver

volumes:
  sql_data:
